stages:
  - build

build_game:
  stage: build
  image: python:3.11-slim
  before_script:
    - apt-get update && apt-get install -y curl tar
    - curl -sSL https://github.com/aspizu/goboscript/releases/download/v3.2.1/goboscript_Linux_x86_64.tar.gz | tar -xz -C /usr/local/bin/
    - chmod +x /usr/local/bin/goboscript
    - goboscript --version
  script:
    - python build.py
  artifacts:
    name: "green_patrol_optimized-$CI_COMMIT_SHORT_SHA"
    paths:
      - green_patrol_optimized.sb3
    expire_in: 30 days
